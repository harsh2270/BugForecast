<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BugForecast — Predictive Defect Risk</title>
<style>
:root{--bg:#0b0f19;--card:#131a2bcc;--line:#1f2a44;--fg:#e6ebf5;--dim:#8b96ad;
--red:#f87171;--amber:#fbbf24;--green:#34d399;--blue:#60a5fa;--violet:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 'Segoe UI',system-ui,sans-serif;
min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
@media (max-width:560px){.logo{font-size:36px}.tag{font-size:15px}.card{padding:18px}.wrap{max-width:100%}}
/* animated aurora background */
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 14s ease-in-out infinite;pointer-events:none}
.orb.a{width:520px;height:520px;background:#3b82f6;top:-140px;left:-120px}
.orb.b{width:460px;height:460px;background:#8b5cf6;bottom:-120px;right:-100px;animation-delay:-5s}
.orb.c{width:380px;height:380px;background:#06b6d4;top:40%;left:60%;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.12)}66%{transform:translate(-40px,50px) scale(.94)}}
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.4;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}
.wrap{position:relative;z-index:2;text-align:center;max-width:720px;padding:24px}
.logo{font-size:54px;font-weight:800;letter-spacing:-1px;
background:linear-gradient(90deg,var(--blue),var(--violet),var(--blue));
-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;
animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.tag{color:var(--dim);margin:10px 0 34px;font-size:17px}
.tag .w{display:inline-block;overflow:hidden;white-space:nowrap;border-right:2px solid var(--violet);
animation:type 2.4s steps(24) 1s forwards,blink 1s step-end infinite;width:0;max-width:100%;vertical-align:bottom}
@keyframes type{to{width:24ch}}
@keyframes blink{50%{border-color:transparent}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;
backdrop-filter:blur(12px);box-shadow:0 20px 60px #0008;animation:rise .8s ease .4s both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
input{width:100%;padding:15px 18px;font-size:16px;color:var(--fg);background:#0d1424;
border:1px solid var(--line);border-radius:12px;outline:none;transition:.25s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #60a5fa22}
button{margin-top:14px;width:100%;padding:15px;font-size:16px;font-weight:700;color:#06121f;
background:linear-gradient(90deg,var(--blue),var(--violet));border:none;border-radius:12px;cursor:pointer;
transition:transform .15s,box-shadow .25s}
button:hover{transform:translateY(-2px);box-shadow:0 12px 30px #60a5fa44}
button:disabled{opacity:.55;cursor:wait;transform:none}
.hint{color:var(--dim);font-size:13px;margin-top:14px}
.hint b{color:var(--blue);cursor:pointer}
.stage{margin-top:20px;display:none;text-align:left}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:5px;
background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .6s ease}
.msg{color:var(--dim);font-size:14px;margin:12px 0 8px;min-height:20px}
.err{color:var(--red);font-size:14px;margin-top:12px;display:none}
.kpis{display:none;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px}
.kpis div{background:#0d1424;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpis .v{font-size:20px;font-weight:700;color:var(--green)}
.kpis .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.open{display:none;margin-top:18px;width:100%;padding:14px;font-size:15px;font-weight:700;
color:#06121f;background:linear-gradient(90deg,var(--green),#22d3ee);border:none;border-radius:12px;
cursor:pointer;text-decoration:none;justify-content:center}
.foot{position:fixed;bottom:16px;color:var(--dim);font-size:12px;z-index:2}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;
animation:pu 1.4s infinite;margin-right:7px}
@keyframes pu{0%{box-shadow:0 0 0 0 #34d39966}70%{box-shadow:0 0 0 10px #34d39900}100%{box-shadow:0 0 0 0 #34d39900}}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
<div class="stars" id="stars"></div>
<div class="wrap">
  <div class="logo">BugForecast</div>
  <div class="tag"><span class="w">predicts where your bugs will be born</span></div>
  <div class="card">
    <input id="url" placeholder="https://github.com/owner/repo" autofocus spellcheck="false">
    <button id="go" onclick="analyze()">Analyze Repository</button>
    <div class="hint">Try: <b onclick="demo('psf/requests')">psf/requests</b> ·
      <b onclick="demo('pallets/flask')">pallets/flask</b> ·
      <b onclick="demo('tiangolo/fastapi')">tiangolo/fastapi</b></div>
    <div class="stage" id="stage">
      <div class="msg" id="msg"><span class="pulse"></span>Starting analysis...</div>
      <div class="bar"><i id="fill"></i></div>
    </div>
    <div class="err" id="err"></div>
    <div class="kpis" id="kpis"></div>
    <a class="open" id="open">Open Full Dashboard &rarr;</a>
  </div>
</div>
<div class="foot">6 ML models · stacked meta-learning · time-safe backtesting · numpy only</div>
<script>
const s=document.getElementById('stars');
for(let i=0;i<70;i++){const d=document.createElement('i');
d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
d.style.animationDelay=Math.random()*3+'s';s.appendChild(d);}

async function analyze(){
  const url=document.getElementById('url').value.trim();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  err.style.display='none';
  if(!url){err.textContent='Paste a GitHub repository URL first.';err.style.display='block';return;}
  btn.disabled=true;
  try{
    const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    if(!r.ok){const t=await r.text();throw new Error('server error '+r.status);}
    const j=await r.json();
    if(j.error){err.textContent=j.error;err.style.display='block';btn.disabled=false;return;}
    poll(j.job,btn);
  }catch(e){err.textContent='Could not reach the analysis server. Is it still running?';err.style.display='block';btn.disabled=false;}
}

async function poll(job,btn){
  document.getElementById('stage').style.display='block';
  let misses=0;
  for(;;){
    let j;
    try{
      const r=await fetch('/api/status/'+job);
      if(!r.ok)throw new Error('status '+r.status);
      j=await r.json();misses=0;
    }catch(e){
      if(++misses>5){err.textContent='Lost connection to the analysis server. Please start again.';
        err.style.display='block';btn.disabled=false;return;}
      await new Promise(r=>setTimeout(r,2000));continue;
    }
    document.getElementById('msg').innerHTML='<span class="pulse"></span>'+j.stage;
    document.getElementById('fill').style.width=j.progress+'%';
    if(j.status==='error'){err.textContent=j.error;err.style.display='block';btn.disabled=false;return;}
    if(j.status==='done'&&j.summary){
      document.getElementById('kpis').style.display='grid';
      document.getElementById('kpis').innerHTML=j.summary.map(([v,l])=>
        `<div><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
      const o=document.getElementById('open');o.style.display='flex';o.href='/report/'+job;
      btn.disabled=false;return;
    }
    await new Promise(r=>setTimeout(r,1200));
  }
}

function demo(u){document.getElementById('url').value='https://github.com/'+u;analyze();}
</script>
</body>
</html>
